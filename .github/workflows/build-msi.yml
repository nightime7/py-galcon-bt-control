name: Build MSI installers

# cx_Freeze bundles the interpreter and native winrt extension modules, which
# are architecture-specific, so each MSI must be built on its target
# architecture - there is no cross-compilation.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install cx_Freeze

      - name: Build MSI
        run: python setup_msi.py bdist_msi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: msi-${{ matrix.arch }}
          path: dist/*.msi

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag
            }
          }
          gh release upload $tag dist/*.msi --clobber
